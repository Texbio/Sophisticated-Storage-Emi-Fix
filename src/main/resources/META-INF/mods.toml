[[mods]]
modId = "sophstorageemifix"
version = "${file.jarVersion}"
displayName = "Sophisticated Storage EMI Fix"
description = '''
Cleans up Sophisticated Storage recipe display in EMI. Removes generic placeholder
recipes and replaces multi-wood-variant dye recipes with single-variant ones that
render at the top-left of the crafting grid.
'''
authors = "sophfix"

[[dependencies.sophstorageemifix]]
