mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.sophstorageemifix]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.21)"
ordering = "NONE"
side = "BOTH"

[[dependencies.sophstorageemifix]]
modId = "emi"
mandatory = true
versionRange = "[0.0.0,)"
ordering = "AFTER"
side = "CLIENT"
